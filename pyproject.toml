[project]
name = "polycopy"
version = "0.1.0"
description = "Single-user Telegram paper copy trader for Polymarket"
requires-python = ">=3.12"
dependencies = [
  "aiogram==3.22.0",
  "httpx==0.28.1",
  "pydantic-settings==2.10.1",
  "SQLAlchemy[asyncio]==2.0.43",
  "asyncpg==0.30.0",
  "alembic==1.16.5",
  "structlog==25.4.0",
  "websockets==15.0.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "aiosqlite>=0.20,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
