services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      # Defaults keep an existing paper installation working untouched. A live
      # instance overrides these in its own .env so the two never share a
      # database: a paper ledger holds invented money.
      POSTGRES_DB: ${POSTGRES_DB:-polycopy}
      POSTGRES_USER: ${POSTGRES_USER:-polycopy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polycopy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-polycopy} -d ${POSTGRES_DB:-polycopy}
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
